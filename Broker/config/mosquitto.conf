
# Broker MQTT
listener 1883
protocol mqtt

# Permitir conexões sem autenticação (desenvolvimento)
allow_anonymous true

# Persistência de mensagens
persistence true
persistence_location /mosquitto/data/
autosave_interval 180

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Configurações de conexão
max_keepalive 120

